version: '3.8'

# InfoKiosk - Raspberry Pi (ARM32/ARM64)
# Deploy via Portainer: Stacks → Add → Upload

services:
  nodered:
    image: nodered/node-red:3.1.9
    platform: linux/arm/v7
    container_name: infokiosk
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
      - ./public/nodered/infokiosk-flows.json:/data/flows.json:ro
      - ./public/worker:/data/static/worker:ro
      - ./public/admin:/data/static/admin:ro
    environment:
      - TZ=Europe/Warsaw
    depends_on:
      - mariadb

  mariadb:
    image: linuxserver/mariadb:10.11.8
    platform: linux/arm/v7
    container_name: infokiosk-db
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Warsaw
      MYSQL_ROOT_PASSWORD: infokiosk_root
      MYSQL_DATABASE: infokiosk
      MYSQL_USER: infokiosk
      MYSQL_PASSWORD: infokiosk_pass
    volumes:
      - mariadb_data:/config

volumes:
  nodered_data:
  mariadb_data:
