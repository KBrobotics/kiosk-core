version: '3.8'

# InfoKiosk - Raspberry Pi
# Deploy via Portainer: Stacks → Add → Upload
# Set GITHUB_REPO environment variable to your repo (e.g., username/infokiosk)

services:
  nodered:
    image: nodered/node-red
    container_name: infokiosk
    restart: unless-stopped
    ports:
      - "8002:1880"
    volumes:
      - nodered_data:/data
    environment:
      - TZ=Europe/Warsaw
      - GITHUB_REPO=${GITHUB_REPO:-}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Install MySQL node if not present
        if [ ! -d /data/node_modules/node-red-node-mysql ]; then
          echo "=== Installing MySQL node ==="
          cd /data && npm install node-red-node-mysql
        fi
        
        # Download and setup from GitHub on first run
        if [ -n "$$GITHUB_REPO" ] && [ ! -f /data/static/.installed ]; then
          echo "=== Downloading from GitHub ==="
          mkdir -p /data/static
          cd /tmp
          wget -q "https://github.com/$$GITHUB_REPO/archive/refs/heads/main.tar.gz" -O repo.tar.gz
          if [ -f repo.tar.gz ]; then
            tar -xzf repo.tar.gz
            REPO_DIR=$$(ls -d */ | head -1)
            
            # Copy static UIs
            for UI in worker admin board; do
              if [ -d "$$REPO_DIR/public/$$UI" ]; then
                cp -r "$$REPO_DIR/public/$$UI" /data/static/
                echo "✓ $$UI UI installed"
              fi
            done
            
            # CRITICAL: Import flows and fix MySQL host for Docker
            if [ -f "$$REPO_DIR/public/nodered/infokiosk-flows.json" ]; then
              sed 's/127.0.0.1/infokiosk-db/g' "$$REPO_DIR/public/nodered/infokiosk-flows.json" > /data/flows.json
              echo "✓ Node-RED flows imported"
            fi
            
            touch /data/static/.installed
            echo "=== Installation complete ==="
            rm -rf /tmp/*
          fi
        fi
        
        # Start Node-RED
        exec node-red
    depends_on:
      - mariadb

  mariadb:
    image: yobasystems/alpine-mariadb
    container_name: infokiosk-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: infokiosk_root
      MYSQL_DATABASE: infokiosk
      MYSQL_USER: infokiosk
      MYSQL_PASSWORD: infokiosk_pass
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  nodered_data:
  mariadb_data:
