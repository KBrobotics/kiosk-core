version: '3.8'

# InfoKiosk - Raspberry Pi Multi-Port Architecture
# Deploy via Portainer: Stacks → Add → Upload
# Set GITHUB_REPO environment variable to your repo (e.g., username/infokiosk)

services:
  # Node-RED: API + WebSocket only (port 8002)
  nodered:
    image: nodered/node-red
    container_name: infokiosk-api
    restart: unless-stopped
    ports:
      - "8002:1880"
    volumes:
      - nodered_data:/data
    environment:
      - TZ=Europe/Warsaw
      - GITHUB_REPO=${GITHUB_REPO:-}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Install MySQL node if not present
        if [ ! -d /data/node_modules/node-red-node-mysql ]; then
          echo "=== Installing MySQL node ==="
          cd /data && npm install node-red-node-mysql
        fi
        
        # Download flows from GitHub on first run
        if [ -n "$$GITHUB_REPO" ] && [ ! -f /data/.installed ]; then
          echo "=== Downloading flows from GitHub ==="
          cd /tmp
          wget -q "https://github.com/$$GITHUB_REPO/archive/refs/heads/main.tar.gz" -O repo.tar.gz
          if [ -f repo.tar.gz ]; then
            tar -xzf repo.tar.gz
            REPO_DIR=$$(ls -d */ | head -1)
            
            # Import flows and fix MySQL host for Docker
            if [ -f "$$REPO_DIR/public/nodered/infokiosk-flows.json" ]; then
              sed 's/127.0.0.1/infokiosk-db/g' "$$REPO_DIR/public/nodered/infokiosk-flows.json" > /data/flows.json
              echo "✓ Node-RED flows imported"
            fi
            
            touch /data/.installed
            echo "=== Installation complete ==="
            rm -rf /tmp/*
          fi
        fi
        
        # Start Node-RED
        exec node-red
    depends_on:
      - mariadb

  # Worker UI (port 8003)
  worker-ui:
    image: nginx:alpine
    container_name: infokiosk-worker
    restart: unless-stopped
    ports:
      - "8003:80"
    volumes:
      - worker_html:/usr/share/nginx/html
    environment:
      - GITHUB_REPO=${GITHUB_REPO:-}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Create nginx config with reverse proxy
        cat > /etc/nginx/conf.d/default.conf << 'NGINX'
        server {
            listen 80;
            server_name localhost;
            root /usr/share/nginx/html;
            index index.html;

            location /api/ {
                proxy_pass http://infokiosk-api:1880/api/;
                proxy_http_version 1.1;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
            }

            location /ws {
                proxy_pass http://infokiosk-api:1880/ws;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $$host;
                proxy_read_timeout 86400;
            }

            location / {
                try_files $$uri $$uri/ /index.html;
            }
        }
        NGINX
        
        # Download UI from GitHub if not present (check .installed marker)
        echo "=== Worker UI Startup ==="
        echo "GITHUB_REPO: $$GITHUB_REPO"
        echo ".installed exists: $$([ -f /usr/share/nginx/html/.installed ] && echo yes || echo no)"
        
        if [ ! -f /usr/share/nginx/html/.installed ]; then
          echo "=== Installing Worker UI ==="
          rm -rf /usr/share/nginx/html/*
          
          if [ -n "$$GITHUB_REPO" ]; then
            apk add --no-cache wget
            cd /tmp
            echo "Downloading from: https://github.com/$$GITHUB_REPO/archive/refs/heads/main.tar.gz"
            wget -v "https://github.com/$$GITHUB_REPO/archive/refs/heads/main.tar.gz" -O repo.tar.gz 2>&1
            
            if [ -f repo.tar.gz ] && [ -s repo.tar.gz ]; then
              tar -xzf repo.tar.gz
              REPO_DIR=$$(ls -d */ | head -1)
              echo "Extracted to: $$REPO_DIR"
              echo "Looking for: $$REPO_DIR/public/worker"
              ls -la "$$REPO_DIR/public/" 2>/dev/null || echo "public/ not found"
              
              if [ -d "$$REPO_DIR/public/worker" ]; then
                cp -r "$$REPO_DIR/public/worker/"* /usr/share/nginx/html/
                touch /usr/share/nginx/html/.installed
                echo "✓ Worker UI installed successfully"
              else
                echo "✗ Worker UI folder not found in repo"
              fi
              rm -rf /tmp/*
            else
              echo "✗ Download failed or empty file"
            fi
          else
            echo "✗ GITHUB_REPO not set"
          fi
          
          # Fallback: create debug page if installation failed
          if [ ! -f /usr/share/nginx/html/index.html ]; then
            echo "Creating fallback debug page..."
            cat > /usr/share/nginx/html/index.html << 'HTML'
        <!DOCTYPE html>
        <html><head><title>Worker UI - Not Installed</title></head>
        <body style="font-family:monospace;padding:2rem;">
        <h1>Worker UI Installation Failed</h1>
        <p>Check container logs: <code>docker logs infokiosk-worker</code></p>
        <p>Ensure GITHUB_REPO environment variable is set correctly.</p>
        </body></html>
        HTML
          fi
        fi
        exec nginx -g 'daemon off;'
    depends_on:
      - nodered

