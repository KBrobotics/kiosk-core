version: '3.8'

# InfoKiosk - Raspberry Pi Multi-Port Architecture
# Deploy via Portainer: Stacks → Add → Upload
# Set GITHUB_REPO environment variable to your repo (e.g., username/infokiosk)

services:
  # Node-RED: API + WebSocket only (port 8002)
  nodered:
    image: nodered/node-red
    container_name: infokiosk-api
    restart: unless-stopped
    ports:
      - "8002:1880"
    volumes:
      - nodered_data:/data
    environment:
      - TZ=Europe/Warsaw
      - GITHUB_REPO=${GITHUB_REPO:-}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Install MySQL node if not present
        if [ ! -d /data/node_modules/node-red-node-mysql ]; then
          echo "=== Installing MySQL node ==="
          cd /data && npm install node-red-node-mysql
        fi
        
        # Download flows from GitHub on first run
        if [ -n "$$GITHUB_REPO" ] && [ ! -f /data/.installed ]; then
          echo "=== Downloading flows from GitHub ==="
          cd /tmp
          wget -q "https://github.com/$$GITHUB_REPO/archive/refs/heads/main.tar.gz" -O repo.tar.gz
          if [ -f repo.tar.gz ]; then
            tar -xzf repo.tar.gz
            REPO_DIR=$$(ls -d */ | head -1)
            
            # Import flows and fix MySQL host for Docker
            if [ -f "$$REPO_DIR/public/nodered/infokiosk-flows.json" ]; then
              sed 's/127.0.0.1/infokiosk-db/g' "$$REPO_DIR/public/nodered/infokiosk-flows.json" > /data/flows.json
              echo "✓ Node-RED flows imported"
            fi
            
            touch /data/.installed
            echo "=== Installation complete ==="
            rm -rf /tmp/*
          fi
        fi
        
        # Start Node-RED
        exec node-red
    depends_on:
      - mariadb

  # Worker UI (port 8003)
  worker-ui:
    image: nginx:alpine
    container_name: infokiosk-worker
    restart: unless-stopped
    ports:
      - "8003:80"
    volumes:
      - worker_html:/usr/share/nginx/html:ro
      - ./nginx-worker.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - GITHUB_REPO=${GITHUB_REPO:-}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Download UI from GitHub if not present
        if [ -n "$$GITHUB_REPO" ] && [ ! -f /usr/share/nginx/html/index.html ]; then
          echo "=== Downloading Worker UI ==="
          cd /tmp
          wget -q "https://github.com/$$GITHUB_REPO/archive/refs/heads/main.tar.gz" -O repo.tar.gz
          if [ -f repo.tar.gz ]; then
            tar -xzf repo.tar.gz
            REPO_DIR=$$(ls -d */ | head -1)
            if [ -d "$$REPO_DIR/public/worker" ]; then
              cp -r "$$REPO_DIR/public/worker/"* /usr/share/nginx/html/
              echo "✓ Worker UI installed"
            fi
            rm -rf /tmp/*
          fi
        fi
        exec nginx -g 'daemon off;'
    depends_on:
      - nodered

  # Admin UI (port 8004)
  admin-ui:
    image: nginx:alpine
    container_name: infokiosk-admin
    restart: unless-stopped
    ports:
      - "8004:80"
    volumes:
      - admin_html:/usr/share/nginx/html:ro
      - ./nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - GITHUB_REPO=${GITHUB_REPO:-}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Download UI from GitHub if not present
        if [ -n "$$GITHUB_REPO" ] && [ ! -f /usr/share/nginx/html/index.html ]; then
          echo "=== Downloading Admin UI ==="
          cd /tmp
          wget -q "https://github.com/$$GITHUB_REPO/archive/refs/heads/main.tar.gz" -O repo.tar.gz
          if [ -f repo.tar.gz ]; then
            tar -xzf repo.tar.gz
            REPO_DIR=$$(ls -d */ | head -1)
            if [ -d "$$REPO_DIR/public/admin" ]; then
              cp -r "$$REPO_DIR/public/admin/"* /usr/share/nginx/html/
              echo "✓ Admin UI installed"
            fi
            rm -rf /tmp/*
          fi
        fi
        exec nginx -g 'daemon off;'
    depends_on:
      - nodered

  # Board UI (port 8005)
  board-ui:
    image: nginx:alpine
    container_name: infokiosk-board
    restart: unless-stopped
    ports:
      - "8005:80"
    volumes:
      - board_html:/usr/share/nginx/html:ro
      - ./nginx-board.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - GITHUB_REPO=${GITHUB_REPO:-}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        # Download UI from GitHub if not present
        if [ -n "$$GITHUB_REPO" ] && [ ! -f /usr/share/nginx/html/index.html ]; then
          echo "=== Downloading Board UI ==="
          cd /tmp
          wget -q "https://github.com/$$GITHUB_REPO/archive/refs/heads/main.tar.gz" -O repo.tar.gz
          if [ -f repo.tar.gz ]; then
            tar -xzf repo.tar.gz
            REPO_DIR=$$(ls -d */ | head -1)
            if [ -d "$$REPO_DIR/public/board" ]; then
              cp -r "$$REPO_DIR/public/board/"* /usr/share/nginx/html/
              echo "✓ Board UI installed"
            fi
            rm -rf /tmp/*
          fi
        fi
        exec nginx -g 'daemon off;'
    depends_on:
      - nodered

  # MariaDB Database
  mariadb:
    image: yobasystems/alpine-mariadb
    container_name: infokiosk-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: infokiosk_root
      MYSQL_DATABASE: infokiosk
      MYSQL_USER: infokiosk
      MYSQL_PASSWORD: infokiosk_pass
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  nodered_data:
  mariadb_data:
  worker_html:
  admin_html:
  board_html:
