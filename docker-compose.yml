version: '3.8'

# InfoKiosk - Raspberry Pi ARM64/ARM32 Compatible
# Deploy via Portainer or: docker-compose up -d

services:
  nodered:
    image: nodered/node-red:latest-minimal
    container_name: infokiosk
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
      - ./public/nodered/infokiosk-flows.json:/data/flows.json:ro
      - ./public/worker:/data/static/worker:ro
      - ./public/admin:/data/static/admin:ro
    environment:
      - TZ=Europe/Warsaw
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:10.11
    container_name: infokiosk-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: infokiosk_root
      MARIADB_DATABASE: infokiosk
      MARIADB_USER: infokiosk
      MARIADB_PASSWORD: infokiosk_pass
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  nodered_data:
  mariadb_data:
