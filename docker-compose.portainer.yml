version: '3.8'

# InfoKiosk - Raspberry Pi (Portainer Upload Version)
# For Portainer: Stacks → Add → Web editor → Paste this file
# 
# After deployment, run these commands ONCE:
#   docker exec -it infokiosk npm install node-red-node-mysql
#   docker restart infokiosk
# Then import flows via Node-RED UI (Menu → Import)

services:
  nodered:
    image: nodered/node-red:latest
    container_name: infokiosk
    restart: unless-stopped
    ports:
      - "8002:1880"
    volumes:
      - nodered_data:/data
    environment:
      - TZ=Europe/Warsaw
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: yobasystems/alpine-mariadb:latest
    container_name: infokiosk-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: infokiosk_root
      MYSQL_DATABASE: infokiosk
      MYSQL_USER: infokiosk
      MYSQL_PASSWORD: infokiosk_pass
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pinfokiosk_root"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  nodered_data:
  mariadb_data:
